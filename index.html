<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CERTA | Banco de Horas</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="dashboard">

    <!-- RELÓGIO -->
    <div class="clock" id="clock">00:00:00</div>

    <!-- SALDO -->
    <section class="card saldo-card">
      <h2>Saldo de Horas</h2>
      <div id="saldoValor" class="saldo">—</div>
    </section>

    <!-- FORM -->
    <section class="card form-card">
      <h2>Novo Registro</h2>

      <form
        id="formBancoHoras"
        action="https://script.google.com/macros/s/AKfycbz7oyxwHcqq6x7sQWZoyLRowMKxCGtfjfLijcX9iF_ONYqCt5lYvce2qbH5oKPPxSmelg/exec"
        method="GET"
        target="hidden_iframe"
      >

        <input type="text" id="nome" name="nome" placeholder="Nome completo" required>

        <select id="tipo" name="tipo">
          <option value="extra">Hora Extra (+)</option>
          <option value="quitacao">Quitação (-)</option>
        </select>

        <input type="date" id="data" name="data" required>

        <input type="number" id="horas" name="horas" step="0.25" placeholder="Horas (ex: 1.5)" required>

        <input type="text" id="descricao" name="descricao" placeholder="Descrição" required>

        <input type="hidden" id="ts" name="ts">

        <button type="submit">Salvar Registro</button>
      </form>
    </section>

  </main>

  <!-- iframe invisível -->
  <iframe name="hidden_iframe" style="display:none;"></iframe>

  <!-- toast -->
  <div class="toast" id="toast">Registro salvo no Banco de Horas</div>

  <script src="./script.js"></script>
</body>
</html>
